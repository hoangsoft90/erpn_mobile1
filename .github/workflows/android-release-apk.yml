name: android-release-apk

# Phase 11 (Q7) — the SIGNED release build. Runs ONLY when the owner asks:
#   * push a tag `v*`, or
#   * Actions ▸ android-release-apk ▸ Run workflow (workflow_dispatch).
# It never runs on a normal branch push, so no release is produced by accident.
#
# BLOCK: this job cannot produce a valid release until the owner adds the four
# signing secrets (KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD).
# See docs/release-build.md. The keystore is decoded to a gitignored path in CI
# only and is NEVER committed (apps/mobile/android/.gitignore covers *.jks and
# key.properties). The APK is verified NOT to be debug-signed before upload (F1).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_name:
        description: "Optional versionName override (e.g. 1.0.1); empty uses pubspec.yaml"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --- Signing material: required, never committed -------------------------
      - name: Require signing secrets (BLOCK otherwise)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release signing is BLOCKED — owner must add the 4 secrets (docs/release-build.md). No release APK is produced."
            exit 1
          fi

      - name: Decode keystore to a gitignored path
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          ls -l android/app/release-keystore.jks

      - name: Write key.properties (never committed; gitignored)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/apps/mobile/android/app/release-keystore.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          ls -l android/key.properties

      # --- Build pipeline (mirrors the debug workflow) -------------------------
      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # A release APK must never silently fall back to loopback (Phase 10 F1):
      # on a phone 127.0.0.1 IS the phone, so it would "open fine and answer
      # nothing". Refuse to build if the endpoint is empty/loopback.
      - name: Reject a loopback endpoint for release
        env:
          COPILOT_BASE_URL: ${{ vars.COPILOT_BASE_URL }}
        run: |
          case "$COPILOT_BASE_URL" in
            ""|*127.0.0.1*|*localhost*|*0.0.0.0*|*10.0.2.2*)
              echo "::error::COPILOT_BASE_URL ('${COPILOT_BASE_URL}') is empty or a loopback/emulator host — a release APK must point at the real gateway."
              exit 1
              ;;
          esac

      - name: Build release APK (dart-define endpoint + auth)
        env:
          COPILOT_BASE_URL: ${{ vars.COPILOT_BASE_URL }}
          COPILOT_AUTH_USER: ${{ vars.COPILOT_AUTH_USER }}
          COPILOT_AUTH_PASSWORD: ${{ secrets.COPILOT_AUTH_PASSWORD }}
          BUILD_NAME: ${{ github.event.inputs.build_name }}
        run: |
          flutter build apk --release ${BUILD_NAME:+--build-name="$BUILD_NAME"} \
            --dart-define=COPILOT_BASE_URL="${COPILOT_BASE_URL}" \
            --dart-define=COPILOT_AUTH_USER="${COPILOT_AUTH_USER}" \
            --dart-define=COPILOT_AUTH_PASSWORD="${COPILOT_AUTH_PASSWORD}"

      # F1 — a release signed with the Android DEBUG key must be blocked, not
      # shipped. `apksigner verify --print-certs` exposes the certificate CN.
      - name: Verify the APK is NOT debug-signed (F1)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          if grep -qi "CN=Android Debug" /tmp/apk-certs.txt; then
            echo "::error::release APK is signed with the Android DEBUG certificate — refusing to publish (F1). Add the owner keystore secrets."
            exit 1
          fi
          echo "OK: release APK is not debug-signed."

      - name: Checksum (sha256)
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: erpn-chat-release-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
