name: android-debug-apk

# Phase 3 (user decision 2026-09-14): APK builds run on GitHub Actions,
# NEVER on the dev VPS (no Android UI there anyway). Push/PR triggers; the
# debug APK is uploaded as an artifact for direct install on a phone.

on:
  push:
    branches: ["**"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erpn-chat-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
