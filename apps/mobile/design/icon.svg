<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    ERPNext Vietnamese Voice Copilot — master app icon (concept: Chat + dong).
    Layers derived from this file:
      design/icon-background.svg  = gradient plate only (adaptive background)
      design/icon-foreground.svg  = bubble + dong at 62% (adaptive foreground,
                                    content inside the 66dp safe zone)
      design/icon.png             = this full-bleed master (legacy mipmaps)
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0BA695"/>
      <stop offset="1" stop-color="#087F72"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- chat bubble + dong sign -->
  <path d="M 380 660 L 300 800 L 492 690 Z" fill="#FFFFFF"/>
  <rect x="252" y="292" width="540" height="400" rx="92" fill="#FFFFFF"/>
  <g stroke="#087F72" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- bowl of the "d" -->
    <circle cx="540" cy="512" r="92" stroke-width="56"/>
    <!-- ascender of the "d" -->
    <line x1="632" y1="368" x2="632" y2="604" stroke-width="56"/>
    <!-- bar of the dong sign -->
    <line x1="372" y1="512" x2="704" y2="512" stroke-width="48"/>
  </g>
</svg>
